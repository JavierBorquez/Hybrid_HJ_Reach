[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-reach-gpu"
version = "0.2.0.dev0"
description = "Hybrid Hamilton-Jacobi reach, avoid and reach-avoid on JAX"
requires-python = ">=3.10"
dependencies = ["hj_reachability>=0.7.0", "numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
examples = ["matplotlib>=3.6"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
